name: iOS

# يتأكد أن مشروع الآيفون يُبنى، ثم يشغّله في المحاكي ويلتقط صورتين (فاتح وداكن)
on:
  push:
    paths:
      - "ios/**"
      - "docs/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iPhone (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/QatrAlNada.xcodeproj -scheme QatrAlNada -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1 || { tail -80 build-device.log; exit 1; }
          grep -E "warning:|error:" build-device.log | sort -u || true
          APP=build/device/Build/Products/Release-iphoneos/QatrAlNada.app
          plutil -p "$APP/Info.plist"
          test -f "$APP/docs/index.html" && test -f "$APP/docs/data/part-f.js" && test -f "$APP/PrivacyInfo.xcprivacy"
          # تحذير "nearly matches" يعني أن دالة من دوال المندوب لن تُستدعى
          ! grep -q "nearly matches" build-device.log

      - name: Run in the simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/QatrAlNada.xcodeproj -scheme QatrAlNada -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build -quiet
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          pro = [d for d in devs if "Pro" in d["name"]]
          print((pro or devs)[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/QatrAlNada.app
          xcrun simctl launch "$UDID" com.qatralnada.mushajjara
          sleep 15
          mkdir -p shots
          xcrun simctl io "$UDID" screenshot shots/light.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/dark.png
          xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'eventMessage CONTAINS "QATR"' | tee shots/log.txt
          grep -q "QATR loaded: 35 chapters" shots/log.txt
          ! grep -q "JS error" shots/log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            shots
            build-device.log
